<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }
  body {
    background: radial-gradient(circle at 50% 38%, #16281b 0%, #0d1912 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .seal {
    width: 150px;
    height: 150px;
    display: block;
    margin: 0 auto 28px;
  }
  .seal-badge { fill: #c19a4a; }
  .seal-groove { fill: none; stroke: #16110a; stroke-width: 1; opacity: 0.22; }
  .seal-icon { fill: #16110a; }
  .seal-spine { fill: none; stroke: #c19a4a; stroke-width: 0.9; opacity: 0.6; }
  .seal-barb { fill: none; stroke: #c19a4a; stroke-width: 0.6; stroke-linecap: round; opacity: 0.55; }
  h1 {
    margin: 0;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    font-size: 58px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #eee9db;
  }
  p.role {
    margin: 18px 0 0;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #c19a4a;
  }
  p.registro {
    margin: 14px 0 0;
    font-size: 16px;
    letter-spacing: 1.5px;
    color: #a9a690;
  }
  .rule {
    width: 90px;
    height: 1px;
    margin: 26px auto 0;
    background: rgba(238, 233, 219, 0.22);
  }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="seal" viewBox="0 0 100 100" aria-hidden="true">
      <g class="seal-badge">
        <circle cx="50" cy="50" r="24" />
        <circle cx="84" cy="50" r="13" />
        <circle cx="79.44" cy="67" r="13" />
        <circle cx="67" cy="79.44" r="13" />
        <circle cx="50" cy="84" r="13" />
        <circle cx="33" cy="79.44" r="13" />
        <circle cx="20.56" cy="67" r="13" />
        <circle cx="16" cy="50" r="13" />
        <circle cx="20.56" cy="33" r="13" />
        <circle cx="33" cy="20.56" r="13" />
        <circle cx="50" cy="16" r="13" />
        <circle cx="67" cy="20.56" r="13" />
        <circle cx="79.44" cy="33" r="13" />
      </g>
      <circle class="seal-groove" cx="50" cy="50" r="20" />
      <ellipse class="seal-icon" cx="44" cy="58" rx="7" ry="2.2" />
      <path class="seal-icon" d="M37,58 C37,58 38,65 44,66 C50,65 51,58 51,58 Z" />
      <path class="seal-icon" d="M44,58 Q53.3,49.9 58,34 Q46.4,45.9 44,58 Z" />
      <path class="seal-spine" d="M44,58 L58,34" />
      <path class="seal-barb" d="M47.5,52 L50.1,53.5" />
      <path class="seal-barb" d="M50.3,47.2 L47.4,45.5" />
      <path class="seal-barb" d="M53.1,42.4 L55.3,43.7" />
      <path class="seal-barb" d="M55.9,37.6 L54.4,36.7" />
    </svg>
    <h1>Sofia Echesortu</h1>
    <p class="role">Escribana</p>
    <div class="rule"></div>
    <p class="registro">Registro Nro. 238 &middot; Rosario, Santa Fe</p>
  </div>
</body>
</html>
